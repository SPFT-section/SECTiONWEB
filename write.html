<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var d=JSON.parse(localStorage.getItem("section_db_v1"));if(d&&d.settings&&d.settings.theme==="light")document.documentElement.classList.add("theme-light");}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">

<body data-page="write">

<header class="topbar">
  <div class="topbar-inner">

      <a href="index.html" class="brand-mark">SECTi<span class="dot">O</span>N</a>

    </div>
    <div class="topbar-right">
      <button type="button" id="theme-toggle" class="theme-toggle-btn" title="Toggle light / dark mode"><i class="fa-solid fa-moon"></i></button>
      <span class="lang-switch">EN</span>
      <span id="auth-slot"><a href="login.html" class="btn btn-outline btn-sm">Login</a></span>
    </div>
  </div>
</header>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html"><i class="fa-solid fa-house"></i>Home</a>

    <a href="history.html"><i class="fa-solid fa-clock-rotate-left"></i>History</a>

</nav>

    <span>SECTiON · Light Novels</span>
    <div class="footer-social">
      <a href="#"><i class="fa-brands fa-github"></i></a>
